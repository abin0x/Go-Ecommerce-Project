<svg viewBox="0 0 1800 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #000; font-family: Arial, sans-serif; }
      .component-name { font-size: 13px; font-weight: bold; fill: #000; font-family: Arial, sans-serif; }
      .pin-label { font-size: 10px; fill: #333; font-family: Arial, sans-serif; }
      .legend-text { font-size: 11px; fill: #333; font-family: Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1800" height="1100" fill="#f8f8f8"/>

  <!-- Title -->
  <text x="900" y="35" text-anchor="middle" class="title">Real-time Bus Tracking System - Fritzing Style Wiring Diagram</text>

  <!-- ==================== LEGEND ==================== -->
  <g id="legend">
    <rect x="20" y="45" width="240" height="140" fill="#fff" stroke="#333" stroke-width="2" rx="8"/>
    <text x="30" y="65" class="component-name">Wire Legend:</text>
    <line x1="30" y1="80" x2="60" y2="80" stroke="red" stroke-width="3"/>
    <text x="70" y="85" class="legend-text">Power (+)</text>
    <line x1="30" y1="100" x2="60" y2="100" stroke="black" stroke-width="3"/>
    <text x="70" y="105" class="legend-text">Ground (-)</text>
    <line x1="30" y1="120" x2="60" y2="120" stroke="#00aa00" stroke-width="2.5"/>
    <text x="70" y="125" class="legend-text">UART (TX/RX)</text>
    <line x1="30" y1="140" x2="60" y2="140" stroke="#ff8800" stroke-width="2.5"/>
    <text x="70" y="145" class="legend-text">GPIO Signals</text>
    <line x1="30" y1="160" x2="60" y2="160" stroke="#9933ff" stroke-width="2.5"/>
    <text x="70" y="165" class="legend-text">Buzzer</text>
  </g>

  <!-- ==================== BATTERY ==================== -->
  <g id="battery">
    <rect x="50" y="220" width="100" height="130" fill="#ffe6e6" stroke="#cc0000" stroke-width="2.5" rx="8"/>
    <ellipse cx="100" cy="235" rx="18" ry="7" fill="#cc0000"/>
    <text x="100" y="290" text-anchor="middle" class="component-name">Battery</text>
    <text x="100" y="308" text-anchor="middle" class="pin-label">7.4V - 9V</text>
    <circle cx="70" cy="265" r="5" fill="red" stroke="#cc0000" stroke-width="2"/>
    <circle cx="130" cy="265" r="5" fill="#333" stroke="#000" stroke-width="2"/>
    <text x="55" y="270" class="pin-label">(+)</text>
    <text x="145" y="270" class="pin-label">(-)</text>
  </g>

  <!-- ==================== ROCKER SWITCH ==================== -->
  <g id="switch">
    <rect x="50" y="390" width="100" height="90" fill="#e8e8e8" stroke="#555" stroke-width="2" rx="6"/>
    <rect x="65" y="410" width="70" height="25" fill="#999" stroke="#333" stroke-width="1" rx="3"/>
    <circle cx="80" cy="422" r="3" fill="#333"/>
    <circle cx="100" cy="422" r="3" fill="#333"/>
    <text x="100" y="460" text-anchor="middle" class="component-name">Rocker</text>
    <text x="100" y="475" text-anchor="middle" class="component-name">Switch</text>
    <circle cx="75" cy="495" r="4" fill="red" stroke="#cc0000" stroke-width="2"/>
    <circle cx="125" cy="495" r="4" fill="#333" stroke="#000" stroke-width="2"/>
  </g>

  <!-- ==================== LM2596 ==================== -->
  <g id="lm2596">
    <rect x="250" y="220" width="150" height="160" fill="#fff9e6" stroke="#cc9900" stroke-width="2.5" rx="8"/>
    <text x="325" y="250" text-anchor="middle" class="component-name">LM2596</text>
    <text x="325" y="266" text-anchor="middle" class="component-name">Buck Converter</text>
    <rect x="270" y="280" width="110" height="30" fill="#222" stroke="#666" stroke-width="1" rx="2"/>
    <text x="325" y="303" text-anchor="middle" class="component-name" fill="#0f0">5.0V</text>
    <circle cx="260" cy="330" r="5" fill="red" stroke="#cc0000" stroke-width="2"/>
    <circle cx="260" cy="360" r="5" fill="#333" stroke="#000" stroke-width="2"/>
    <circle cx="390" cy="330" r="5" fill="red" stroke="#cc0000" stroke-width="2"/>
    <circle cx="390" cy="360" r="5" fill="#333" stroke="#000" stroke-width="2"/>
    <text x="245" y="336" text-anchor="end" class="pin-label">IN+</text>
    <text x="245" y="366" text-anchor="end" class="pin-label">IN-</text>
    <text x="405" y="336" text-anchor="start" class="pin-label">OUT+</text>
    <text x="405" y="366" text-anchor="start" class="pin-label">OUT-</text>
  </g>

  <!-- ==================== SIM7600E ==================== -->
  <g id="sim7600">
    <rect x="520" y="220" width="150" height="200" fill="#ffe6f0" stroke="#c2185b" stroke-width="2.5" rx="8"/>
    <text x="595" y="250" text-anchor="middle" class="component-name">SIM7600E</text>
    <text x="595" y="266" text-anchor="middle" class="component-name">LTE Module</text>
    <rect x="565" y="285" width="35" height="20" fill="#999" stroke="#333" stroke-width="1" rx="1"/>
    <text x="582" y="298" text-anchor="middle" class="pin-label">SIM</text>
    <circle cx="530" cy="330" r="4" fill="red" stroke="#cc0000" stroke-width="2"/>
    <circle cx="530" cy="360" r="4" fill="#333" stroke="#000" stroke-width="2"/>
    <circle cx="530" cy="390" r="4" fill="#00aa00" stroke="#009900" stroke-width="2"/>
    <circle cx="530" cy="420" r="4" fill="#00aa00" stroke="#009900" stroke-width="2"/>
    <text x="515" y="336" text-anchor="end" class="pin-label">5-12V</text>
    <text x="515" y="366" text-anchor="end" class="pin-label">GND</text>
    <text x="515" y="396" text-anchor="end" class="pin-label">RXD</text>
    <text x="515" y="426" text-anchor="end" class="pin-label">TXD</text>
  </g>

  <!-- ==================== ESP32 ==================== -->
  <g id="esp32">
    <rect x="820" y="220" width="170" height="380" fill="#e6f2ff" stroke="#0052cc" stroke-width="2.5" rx="8"/>
    <text x="905" y="250" text-anchor="middle" class="component-name">ESP32</text>
    <text x="905" y="266" text-anchor="middle" class="component-name">DevKit V1</text>
    
    <circle cx="835" cy="295" r="3.5" fill="#333" stroke="#000" stroke-width="1.5"/>
    <circle cx="835" cy="320" r="3.5" fill="red" stroke="#cc0000" stroke-width="1.5"/>
    <circle cx="835" cy="345" r="3.5" fill="#00aa00" stroke="#009900" stroke-width="1.5"/>
    <circle cx="835" cy="370" r="3.5" fill="#00aa00" stroke="#009900" stroke-width="1.5"/>
    <circle cx="835" cy="395" r="3.5" fill="#ff8800" stroke="#cc6600" stroke-width="1.5"/>
    <circle cx="835" cy="420" r="3.5" fill="#ff8800" stroke="#cc6600" stroke-width="1.5"/>
    <circle cx="835" cy="445" r="3.5" fill="#ff8800" stroke="#cc6600" stroke-width="1.5"/>
    <circle cx="835" cy="470" r="3.5" fill="#ff8800" stroke="#cc6600" stroke-width="1.5"/>
    <circle cx="835" cy="495" r="3.5" fill="#ff8800" stroke="#cc6600" stroke-width="1.5"/>
    <circle cx="835" cy="520" r="3.5" fill="#9933ff" stroke="#663399" stroke-width="1.5"/>
    <circle cx="975" cy="295" r="3.5" fill="#333" stroke="#000" stroke-width="1.5"/>
    
    <text x="820" y="300" text-anchor="end" class="pin-label">GND</text>
    <text x="820" y="325" text-anchor="end" class="pin-label">VIN</text>
    <text x="820" y="350" text-anchor="end" class="pin-label">G16(RX)</text>
    <text x="820" y="375" text-anchor="end" class="pin-label">G17(TX)</text>
    <text x="820" y="400" text-anchor="end" class="pin-label">G18</text>
    <text x="820" y="425" text-anchor="end" class="pin-label">G19</text>
    <text x="820" y="450" text-anchor="end" class="pin-label">G21</text>
    <text x="820" y="475" text-anchor="end" class="pin-label">G22</text>
    <text x="820" y="500" text-anchor="end" class="pin-label">G23</text>
    <text x="820" y="525" text-anchor="end" class="pin-label">G4</text>
    <text x="990" y="300" text-anchor="start" class="pin-label">GND</text>
    
    <rect x="865" y="540" width="50" height="15" fill="#000" stroke="#333" stroke-width="1" rx="2"/>
    <text x="890" y="552" text-anchor="middle" class="pin-label" fill="#fff">USB-C</text>
  </g>

  <!-- ==================== BUTTONS ==================== -->
  <g id="buttons">
    <rect x="1150" y="240" width="80" height="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="5"/>
    <circle cx="1190" cy="265" r="8" fill="#666" stroke="#333" stroke-width="1"/>
    <circle cx="1165" cy="290" r="2.5" fill="#666"/>
    <circle cx="1215" cy="290" r="2.5" fill="#666"/>
    <text x="1190" y="315" text-anchor="middle" class="pin-label">Button1</text>
    
    <rect x="1150" y="320" width="80" height="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="5"/>
    <circle cx="1190" cy="345" r="8" fill="#666" stroke="#333" stroke-width="1"/>
    <circle cx="1165" cy="370" r="2.5" fill="#666"/>
    <circle cx="1215" cy="370" r="2.5" fill="#666"/>
    <text x="1190" y="395" text-anchor="middle" class="pin-label">Button2</text>
    
    <rect x="1150" y="400" width="80" height="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="5"/>
    <circle cx="1190" cy="425" r="8" fill="#666" stroke="#333" stroke-width="1"/>
    <circle cx="1165" cy="450" r="2.5" fill="#666"/>
    <circle cx="1215" cy="450" r="2.5" fill="#666"/>
    <text x="1190" y="475" text-anchor="middle" class="pin-label">Button3</text>
  </g>

  <!-- ==================== LEDs & RESISTORS ==================== -->
  <g id="leds">
    <!-- Green LED -->
    <circle cx="1350" cy="320" r="10" fill="#00ff00" stroke="#009900" stroke-width="2"/>
    <line x1="1340" y1="330" x2="1340" y2="350" stroke="#333" stroke-width="2"/>
    <line x1="1360" y1="330" x2="1360" y2="350" stroke="#333" stroke-width="2"/>
    <text x="1350" y="370" text-anchor="middle" class="pin-label">GreenLED</text>
    
    <!-- Red LED -->
    <circle cx="1350" cy="430" r="10" fill="#ff0000" stroke="#cc0000" stroke-width="2"/>
    <line x1="1340" y1="440" x2="1340" y2="460" stroke="#333" stroke-width="2"/>
    <line x1="1360" y1="440" x2="1360" y2="460" stroke="#333" stroke-width="2"/>
    <text x="1350" y="480" text-anchor="middle" class="pin-label">RedLED</text>
  </g>

  <!-- ==================== BUZZER ==================== -->
  <g id="buzzer">
    <rect x="1500" y="520" width="90" height="60" fill="#fff0e6" stroke="#ff8c00" stroke-width="2" rx="5"/>
    <circle cx="1520" cy="545" r="7" fill="#ff8c00" stroke="#cc6600" stroke-width="1"/>
    <path d="M 1545 535 Q 1560 535 1560 545 Q 1560 555 1545 555" fill="none" stroke="#ff8c00" stroke-width="3"/>
    <line x1="1520" y1="552" x2="1520" y2="570" stroke="#333" stroke-width="2"/>
    <line x1="1560" y1="552" x2="1560" y2="570" stroke="#333" stroke-width="2"/>
    <text x="1545" y="600" text-anchor="middle" class="pin-label">Buzzer(5V)</text>
  </g>

  <!-- ==================== WIRING ==================== -->
  
  <!-- Battery+ to Rocker -->
  <path d="M 70 220 L 70 180 L 75 180 L 75 390" fill="none" stroke="red" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Rocker to LM2596 IN+ -->
  <path d="M 75 495 L 75 600 L 200 600 L 200 330 L 260 330" fill="none" stroke="red" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Battery- to LM2596 IN- -->
  <path d="M 130 265 L 170 265 L 170 360 L 260 360" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Rocker GND to LM2596 IN- -->
  <path d="M 125 495 L 140 495 L 140 650 L 200 650 L 200 360" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- LM2596 OUT+ to SIM7600 5-12V -->
  <path d="M 390 330 L 450 330 L 450 330 L 530 330" fill="none" stroke="red" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- LM2596 OUT- to SIM7600 GND -->
  <path d="M 390 360 L 460 360 L 460 360 L 530 360" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ==================== COMMON GROUND ==================== -->
  <path d="M 530 360 L 490 360 L 490 150 L 835 150 L 835 295" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,4"/>
  <text x="500" y="145" text-anchor="middle" class="component-name" fill="#c41e3a" font-weight="bold">⚡ COMMON GND ⚡</text>

  <!-- USB Power to ESP32 -->
  <path d="M 890 555 L 890 620 L 1050 620" fill="none" stroke="red" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,3"/>
  <rect x="1050" y="610" width="70" height="20" fill="#fff" stroke="#333" stroke-width="1.5" rx="3"/>
  <text x="1085" y="624" text-anchor="middle" class="pin-label">USB/PC</text>
  <path d="M 1050 620 L 960 620 L 960 295 L 975 295" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,3"/>

  <!-- ==================== UART ==================== -->
  
  <!-- G16 RX to SIM7600 TXD -->
  <path d="M 835 345 L 780 345 L 780 420 L 530 420" fill="none" stroke="#00aa00" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- G17 TX to SIM7600 RXD -->
  <path d="M 835 370 L 770 370 L 770 390 L 530 390" fill="none" stroke="#00aa00" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ==================== BUTTONS TO GPIO ==================== -->
  
  <!-- Button 1 to G18 -->
  <path d="M 1165 290 L 1110 290 L 1110 395 L 835 395" fill="none" stroke="#ff8800" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Button 2 to G19 -->
  <path d="M 1165 370 L 1100 370 L 1100 420 L 835 420" fill="none" stroke="#ff8800" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Button 3 to G21 -->
  <path d="M 1165 450 L 1090 450 L 1090 445 L 835 445" fill="none" stroke="#ff8800" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Button GND Common -->
  <path d="M 1215 290 L 1270 290 L 1270 680 L 835 680 L 835 295" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ==================== LEDs ==================== -->
  
  <!-- G22 to Green LED (with resistor) -->
  <path d="M 835 470 L 740 470 L 740 320 L 1310 320" fill="none" stroke="#ff8800" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="1300" y="315" width="30" height="10" fill="#fff8dc" stroke="#cc6600" stroke-width="1"/>
  <text x="1315" y="322" text-anchor="middle" class="pin-label">220Ω</text>
  
  <!-- G23 to Red LED (with resistor) -->
  <path d="M 835 495 L 720 495 L 720 430 L 1310 430" fill="none" stroke="#ff8800" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="1300" y="425" width="30" height="10" fill="#fff8dc" stroke="#cc6600" stroke-width="1"/>
  <text x="1315" y="432" text-anchor="middle" class="pin-label">220Ω</text>
  
  <!-- LED Cathodes to GND -->
  <path d="M 1360 340 L 1400 340 L 1400 700 L 835 700 L 835 295" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 1360 450 L 1420 450 L 1420 720 L 835 720 L 835 295" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ==================== BUZZER ==================== -->
  
  <!-- G4 to Buzzer -->
  <path d="M 835 520 L 700 520 L 700 545 L 1500 545" fill="none" stroke="#9933ff" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Buzzer to GND -->
  <path d="M 1560 570 L 1590 570 L 1590 740 L 835 740 L 835 295" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ==================== INFO BOX ==================== -->
  <g id="info">
    <rect x="50" y="820" width="1700" height="240" fill="#f0f0ff" stroke="#0052cc" stroke-width="2" rx="8"/>
    <text x="900" y="850" text-anchor="middle" class="title" font-size="16">CRITICAL CONNECTIONS & IMPLEMENTATION NOTES</text>
    
    <text x="70" y="880" class="component-name">Power Setup:</text>
    <text x="90" y="900" class="legend-text">• Battery (7.4-9V) connects through Rocker Switch to LM2596 IN+, Battery negative to IN-</text>
    <text x="90" y="920" class="legend-text">• LM2596 adjusted to 5.0V output powers SIM7600 only</text>
    <text x="90" y="940" class="legend-text">• ESP32 powered via USB-C from PC/adapter for development</text>
    
    <text x="70" y="970" class="component-name">UART Communication (Serial2):</text>
    <text x="90" y="990" class="legend-text">• GPIO 16 (RX2) ← SIM7600 TXD  |  GPIO 17 (TX2) → SIM7600 RXD  (Baud: 115200)</text>
    
    <text x="70" y="1020" class="component-name">GPIO Controls:</text>
    <text x="90" y="1040" class="legend-text">• Buttons (G18, G19, G21): Pull-down to GND. Use internal pullups in code.  |  LEDs (G22, G23): PWM capable</text>
    <text x="90" y="1060" class="legend-text">• Buzzer (G4): PWM for tone control  |  All peripheral GND returns collected at main ground rail</text>
  </g>
</svg>
